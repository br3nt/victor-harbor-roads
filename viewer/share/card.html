<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  .card{width:1200px;height:630px;position:relative;overflow:hidden;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#0b3c4c;color:#fff}
  .bg{position:absolute;right:0;top:0;width:740px;height:630px;opacity:.92;
    background:url(bg.webp) -470px -120px / 1720px auto no-repeat;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 38%);mask-image:linear-gradient(to right,transparent 0,#000 38%)}
  .txt{position:absolute;left:64px;top:56px;width:640px}
  .kick{font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#7fd3e8;font-weight:700}
  h1{font-size:62px;line-height:1.05;margin:16px 0 22px;font-weight:800;letter-spacing:-.01em}
  .stats{display:flex;gap:14px;margin-top:8px}
  .st{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 16px;min-width:150px}
  .st b{display:block;font-size:38px;line-height:1;color:#ffb4a8}
  .st span{font-size:16px;color:#d7eef4}
  .foot{position:absolute;left:64px;bottom:40px;font-size:21px;color:#cfe6ec}
  .foot strong{color:#fff}
</style></head>
<body><div class="card">
  <div class="bg"></div>
  <div class="txt">
    <div class="kick">Victor Harbor road changes</div>
    <h1>What would the one&#8209;way loop and 30&nbsp;km/h actually do?</h1>
    <div class="stats">
      <div class="st"><b>+60%</b><span>time in queues,<br>summer day</span></div>
      <div class="st"><b>15→80s</b><span>Lindsay St wait<br>onto Crozier Rd</span></div>
      <div class="st"><b>~80</b><span>trucks a day on<br>the foreshore</span></div>
    </div>
  </div>
  <div class="foot"><strong>Check your own street</strong> · an independent traffic simulation by Brent Jacobs</div>
</div></body></html>
