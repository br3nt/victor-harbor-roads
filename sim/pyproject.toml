[project]
name = "vhsim"
version = "0.1.0"
description = "Victor Harbor traffic simulation (SUMO) for testing VHITS options"
requires-python = ">=3.11"
dependencies = ["eclipse-sumo==1.28.*", "sumolib", "traci", "numpy", "pandas", "shapely", "pyproj"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs SUMO binaries on real data (deselect with -m 'not slow')"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vhsim*"]

[tool.setuptools.package-data]
"vhsim.network" = ["*.xml", "fixes/*.xml"]
